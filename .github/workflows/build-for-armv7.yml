name: Build Node.js (v24.x+) for ARMv7

on:
  workflow_dispatch:
    inputs:
      node_branch:
        description: 'Node.js branch to build (e.g. v26.x, v22.x). Leave empty to use default.'
        required: false
        default: ''
  push:
    branches:
      - main

env:
  NODE_BRANCH: v26.x

jobs:
  # ============================================================
  # JOB 1 - Setup, configure, build all host tools
  # (mksnapshot, torque, bytecode_builtins_list_generator, etc.)
  # ============================================================
  build-host-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      node_version: ${{ steps.get_version.outputs.node_version }}

    steps:
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install tttapa ARMv7 toolchain
        run: |
          wget -q https://github.com/tttapa/toolchains/releases/download/1.3.1/x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz
          mkdir -p /opt/tttapa-toolchains
          tar -xf x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz \
            --strip-components=1 \
            -C /opt/tttapa-toolchains \
            x-tools/armv7-neon-linux-gnueabihf
          TOOLCHAIN_BIN=/opt/tttapa-toolchains/armv7-neon-linux-gnueabihf/bin
          "$TOOLCHAIN_BIN/armv7-neon-linux-gnueabihf-g++" --version
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ccache \
            gcc-multilib \
            g++-multilib \
            python3 \
            pkg-config \
            libc6-dev \
            make \
            git

      - name: Configure cross-compilation environment
        run: |
          rustup target add i686-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf

          CROSS_GCC="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-gcc"
          CROSS_GXX="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-g++"

          echo "CC=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CC_host=ccache gcc -m32 -msse2" >> $GITHUB_ENV
          echo "CXX_host=ccache g++ -m32 -msse2" >> $GITHUB_ENV
          echo "CC_target=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX_target=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=${CROSS_GCC}" >> $GITHUB_ENV

      - name: Clone Node.js and checkout release commit
        id: get_version
        run: |
          # Use manually entered branch if provided, otherwise fall back to env default
          BRANCH="${{ github.event.inputs.node_branch }}"
          BRANCH="${BRANCH:-${{ env.NODE_BRANCH }}}"
          echo "Building Node.js from branch: $BRANCH"

          git clone --branch "$BRANCH" --single-branch \
            https://github.com/nodejs/node.git node
          cd node

          # Find the first commit matching the release pattern:
          # e.g. "2026-06-18, Version 26.3.1 (Current)"
          # No specific version pinned — always picks the latest release commit
          # on the branch.
          COMMIT_ID=$(git log --format="%H %s" | \
            grep -E "[0-9]{4}-[0-9]{2}-[0-9]{2}, Version [0-9]+\.[0-9]+\.[0-9]+" | \
            head -1 | awk '{print $1}')

          if [ -z "$COMMIT_ID" ]; then
            echo "ERROR: Could not find any release commit on $BRANCH"
            echo "=== Recent commits ==="
            git log --oneline -20
            exit 1
          fi

          echo "=== Found release commit: $COMMIT_ID ==="
          COMMIT_MSG=$(git log -1 --format="%s" "$COMMIT_ID")
          echo "$COMMIT_MSG"

          # Extract version number from commit message
          # e.g. "2026-06-18, Version 26.3.1 (Current)" -> "26.3.1"
          NODE_VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Detected Node.js version: $NODE_VERSION"
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT

          # git checkout puts us in detached HEAD at the exact release commit.
          # Preferred over reset --hard since we cloned the branch only to find
          # the commit — we do not need to stay on the branch tip.
          git checkout "$COMMIT_ID"
          echo "NODE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Patch string-hasher for 32-bit host build
        run: |
          FILE="node/deps/v8/src/strings/string-hasher.cc"

          if ! grep -q "#ifdef __SSE2__" "$FILE"; then
            echo "ERROR: #ifdef __SSE2__ not found in $FILE — file structure may have changed"
            exit 1
          fi

          # Replace all #ifdef __SSE2__ with the combined guard, but only on
          # lines where the surrounding SSE2 block contains _mm_cvtsi128_si64.
          # Strategy: do a global replace, then verify at least one block needed it.
          # Since _mm_cvtsi128_si64 is x86_64-only, any file containing it with
          # a plain #ifdef __SSE2__ needs the patch — safe to replace all occurrences.
          if ! grep -q "_mm_cvtsi128_si64" "$FILE"; then
            echo "ERROR: No _mm_cvtsi128_si64 found in $FILE — patch may not be needed"
            exit 1
          fi

          COUNT=$(grep -c "#ifdef __SSE2__" "$FILE")
          sed -i 's/#ifdef __SSE2__/#if defined(__SSE2__) \&\& defined(__x86_64__)/g' "$FILE"
          echo "Patched $COUNT occurrence(s) in $FILE"

      - name: Configure Node.js
        working-directory: node
        run: |
          ./configure --dest-cpu arm --partly-static

      - name: Patch node_crates mk files
        working-directory: node
        run: |
          NODE_DIR="$(pwd)"

          sed -i 's|mkdir -p $(obj)/gen//release; cargo rustc --release --frozen --target-dir "$(obj)/gen"|mkdir -p $(obj)/gen/i686-unknown-linux-gnu/release; cargo rustc --release --frozen --target i686-unknown-linux-gnu --target-dir "$(obj)/gen"|g' \
            "${NODE_DIR}/out/deps/crates/node_crates.host.mk"
          sed -i 's|$(obj)/gen//release/libnode_crates.a|$(obj)/gen/i686-unknown-linux-gnu/release/libnode_crates.a|g' \
            "${NODE_DIR}/out/deps/crates/node_crates.host.mk"

          sed -i 's|mkdir -p $(obj)/gen//release; cargo rustc --release --frozen --target-dir "$(obj)/gen"|mkdir -p $(obj)/gen/armv7-unknown-linux-gnueabihf/release; cargo rustc --release --frozen --target armv7-unknown-linux-gnueabihf --target-dir "$(obj)/gen"|g' \
            "${NODE_DIR}/out/deps/crates/node_crates.target.mk"
          sed -i 's|$(obj)/gen//release/libnode_crates.a|$(obj)/gen/armv7-unknown-linux-gnueabihf/release/libnode_crates.a|g' \
            "${NODE_DIR}/out/deps/crates/node_crates.target.mk"

          sed -i 's|$(obj)/gen//release/libnode_crates.a|$(obj)/gen/i686-unknown-linux-gnu/release/libnode_crates.a|g' \
            "${NODE_DIR}/out/tools/v8_gypfiles/mksnapshot.host.mk"

          for f in \
            "${NODE_DIR}/out/node.target.mk" \
            "${NODE_DIR}/out/embedtest.target.mk" \
            "${NODE_DIR}/out/cctest.target.mk" \
            "${NODE_DIR}/out/node_mksnapshot.target.mk"; do
            [ -f "$f" ] && sed -i 's|$(obj)/gen//release/libnode_crates.a|$(obj)/gen/armv7-unknown-linux-gnueabihf/release/libnode_crates.a|g' "$f"
          done

          echo "=== Patch verification ==="
          grep "cargo rustc" "${NODE_DIR}/out/deps/crates/node_crates.host.mk"
          grep "cargo rustc" "${NODE_DIR}/out/deps/crates/node_crates.target.mk"

      # Build only the host tools needed before ARM compilation can proceed.
      # These are the slow part: V8 snapshot generator, Torque, bytecode generator.
      # GYP generates a top-level Makefile that accepts target names directly.
      - name: Build host tools only
        working-directory: node
        run: |
          # List available make targets to find the right names
          echo "=== Available top-level make targets ==="
          grep "^\.PHONY" out/Makefile | head -5 || true
          grep "^[a-z].*:$" out/Makefile | head -20 || true

          # GYP top-level Makefile is at out/Makefile, targets are plain names
          # For cross builds, host tools are built as part of these targets
          make -j$(($(nproc)+1)) -C out \
            mksnapshot \
            torque \
            bytecode_builtins_list_generator \
            gen-regexp-special-case \
            2>&1

          # Verify the key binaries exist
          echo "=== Checking host tool binaries ==="
          ls -lh Release/mksnapshot Release/torque 2>/dev/null || \
            ls -lh Release/ | head -20

      # Save the entire source + build tree so Job 2 can continue
      # We exclude heavy intermediate objects that job 2 will rebuild anyway
      - name: Compress build tree for handoff
        working-directory: node
        run: |
          tar --exclude='out/Release/obj/gen/armv7*' \
              --exclude='out/Release/obj.target' \
              -czf /tmp/node-host-build.tar.gz \
              . 2>&1 | tail -5
          ls -lh /tmp/node-host-build.tar.gz

      - name: Upload host build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-host-build
          path: /tmp/node-host-build.tar.gz
          retention-days: 1

  # ============================================================
  # JOB 2 - Download host tools, compile ARM target (part 1)
  # Runs make for up to 5 hours then saves partial build
  # ============================================================
  build-target-1:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: build-host-tools

    steps:
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install tttapa ARMv7 toolchain
        run: |
          wget -q https://github.com/tttapa/toolchains/releases/download/1.3.1/x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz
          mkdir -p /opt/tttapa-toolchains
          tar -xf x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz \
            --strip-components=1 \
            -C /opt/tttapa-toolchains \
            x-tools/armv7-neon-linux-gnueabihf
          TOOLCHAIN_BIN=/opt/tttapa-toolchains/armv7-neon-linux-gnueabihf/bin
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ccache \
            gcc-multilib \
            g++-multilib \
            python3 \
            pkg-config \
            libc6-dev \
            make

      - name: Download host build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-host-build
          path: /tmp

      - name: Restore build tree
        run: |
          mkdir -p /home/runner/work/node/node/node
          tar -xzf /tmp/node-host-build.tar.gz             -C /home/runner/work/node/node/node
          ls /home/runner/work/node/node/node/out/Release/ | head -20

          # Touch all source files to epoch so they appear OLDER than
          # compiled objects — make will correctly skip already-built targets.
          echo "=== Setting source timestamps older than objects ==="
          find /home/runner/work/node/node/node             -not -path "*/out/*"             -type f             -exec touch -t 197001010000 {} +
          echo "Done setting timestamps"

      - name: Configure cross-compilation environment
        run: |
          rustup target add i686-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf

          CROSS_GCC="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-gcc"
          CROSS_GXX="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-g++"

          echo "CC=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CC_host=ccache gcc -m32 -msse2" >> $GITHUB_ENV
          echo "CXX_host=ccache g++ -m32 -msse2" >> $GITHUB_ENV
          echo "CC_target=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX_target=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=${CROSS_GCC}" >> $GITHUB_ENV

      # make is smart enough to see host tools already exist and skip them,
      # then proceed to build ARM target objects and link the final binary
      - name: Build ARM target part 1 (5h timeout)
        working-directory: /home/runner/work/node/node/node
        run: |
          # Run make for up to 5 hours then stop gracefully.
          # The partial build tree is saved so job 3 can continue.
          timeout 18000 make -j$(($(nproc)+1)) || true
          echo "=== Build stopped, saving partial build tree ==="
          ls -lh out/Release/ | head -20

      - name: Compress partial build tree for handoff
        working-directory: /home/runner/work/node/node/node
        run: |
          # Include everything - obj.host, .deps all needed for make to
          # correctly continue without recompiling anything from scratch.
          tar -czf /tmp/node-target-partial.tar.gz               . 2>&1 | tail -5
          ls -lh /tmp/node-target-partial.tar.gz

      - name: Upload partial build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-target-partial
          path: /tmp/node-target-partial.tar.gz
          retention-days: 1



  # ============================================================
  # JOB 3 - Continue ARM build (part 2) + package + release
  # ============================================================
  build-target-2:
    runs-on: ubuntu-latest
    needs: [build-host-tools, build-target-1]

    steps:
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install tttapa ARMv7 toolchain
        run: |
          wget -q https://github.com/tttapa/toolchains/releases/download/1.3.1/x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz
          mkdir -p /opt/tttapa-toolchains
          tar -xf x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz             --strip-components=1             -C /opt/tttapa-toolchains             x-tools/armv7-neon-linux-gnueabihf
          TOOLCHAIN_BIN=/opt/tttapa-toolchains/armv7-neon-linux-gnueabihf/bin
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ccache \
            gcc-multilib \
            g++-multilib \
            python3 \
            pkg-config \
            libc6-dev \
            make

      - name: Download partial build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-target-partial
          path: /tmp

      - name: Restore partial build tree
        run: |
          mkdir -p /home/runner/work/node/node/node
          # --touch sets extracted file timestamps to extraction time,
          # which is newer than source files — make will see objects as
          # up-to-date and skip recompilation correctly.
          tar -xzf /tmp/node-target-partial.tar.gz -C /home/runner/work/node/node/node
          echo "=== Restored build tree ==="
          ls /home/runner/work/node/node/node/out/Release/ | head -20

          # Touch all source files to epoch so they appear OLDER than
          # compiled objects — make will then correctly skip recompilation.
          echo "=== Setting source timestamps older than objects ==="
          find /home/runner/work/node/node/node -not -path "*/out/*" -type f -exec touch -t 197001010000 {} +
          echo "Done setting timestamps"

      - name: Configure cross-compilation environment
        run: |
          rustup target add i686-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf

          CROSS_GCC="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-gcc"
          CROSS_GXX="${TOOLCHAIN_BIN}/armv7-neon-linux-gnueabihf-g++"

          echo "CC=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CC_host=ccache gcc -m32 -msse2" >> $GITHUB_ENV
          echo "CXX_host=ccache g++ -m32 -msse2" >> $GITHUB_ENV
          echo "CC_target=ccache ${CROSS_GCC}" >> $GITHUB_ENV
          echo "CXX_target=ccache ${CROSS_GXX}" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=${CROSS_GCC}" >> $GITHUB_ENV

      - name: Build ARM target part 2 (finish)
        working-directory: /home/runner/work/node/node/node
        run: |
          make -j$(($(nproc)+1))

      - name: Package binary
        env:
          NODE_VERSION: ${{ needs.build-host-tools.outputs.node_version }}
        run: |
          NODE_DIR=/home/runner/work/node/node/node
          RELEASE_DIR=/tmp/node-release
          RELEASE_NAME="node-v${NODE_VERSION}-linux-armv7l"
          MAJOR=$(echo "$NODE_VERSION" | cut -d. -f1)

          make -C "$NODE_DIR" install DESTDIR="$RELEASE_DIR"

          mv "$RELEASE_DIR/usr/local" "$RELEASE_DIR/v${NODE_VERSION}"

          cp "$NODE_DIR/README.md"    "$RELEASE_DIR/v${NODE_VERSION}/"
          cp "$NODE_DIR/LICENSE"      "$RELEASE_DIR/v${NODE_VERSION}/"
          cp "$NODE_DIR/CHANGELOG.md" "$RELEASE_DIR/v${NODE_VERSION}/" 2>/dev/null || \
            cp "$NODE_DIR/doc/changelogs/CHANGELOG_V${MAJOR}.md" \
               "$RELEASE_DIR/v${NODE_VERSION}/CHANGELOG.md" 2>/dev/null || \
            echo "CHANGELOG not found, skipping"

          echo "=== Final archive layout ==="
          ls -la "$RELEASE_DIR/v${NODE_VERSION}/"
          echo "=== node_modules ==="
          ls "$RELEASE_DIR/v${NODE_VERSION}/lib/node_modules/" 2>/dev/null || echo "lib/node_modules not found"
          echo "=== bin ==="
          ls -la "$RELEASE_DIR/v${NODE_VERSION}/bin/"

          mkdir -p "$NODE_DIR/release-artifacts"
          cd "$RELEASE_DIR"
          tar -czf "$NODE_DIR/release-artifacts/$RELEASE_NAME.tar.gz" \
            "v${NODE_VERSION}/"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-host-tools.outputs.node_version }}-armv7l
          name: "Node v${{ needs.build-host-tools.outputs.node_version }} - armv7l"
          files: release-artifacts/node-v${{ needs.build-host-tools.outputs.node_version }}-linux-armv7l.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}