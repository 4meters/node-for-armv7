name: Test Node.js (v24.x+) ARMv7 binary

on:
  workflow_dispatch:
  # Run after build workflow completes
  workflow_run:
    workflows: ["Build Node.js (v24.x+) for ARMv7"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run tests if build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: node

      - name: Install QEMU for ARMv7 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            qemu-user \
            binfmt-support
          # Register ARM binfmt so the kernel runs ARM binaries via QEMU
          sudo update-binfmts --enable qemu-arm
          # Verify QEMU works
          qemu-arm-static --version

      - name: Download node binary from release
        run: |
          # Auto-detect latest release tag e.g. v26.3.0-armv7l
          RELEASE_TAG=$(gh release list             --repo ${{ github.repository }}             --limit 1             --json tagName -q '.[0].tagName')
          echo "Latest release: $RELEASE_TAG"

          # Extract node version: v26.3.0-armv7l -> 26.3.0
          NODE_VERSION=$(echo "$RELEASE_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV
          echo "NODE_BIN=/tmp/v${NODE_VERSION}/bin/node" >> $GITHUB_ENV
          echo "NPM_BIN=/tmp/v${NODE_VERSION}/bin/npm" >> $GITHUB_ENV

          # Download and extract - tar preserves symlinks unlike zip
          gh release download "$RELEASE_TAG" \
            --repo ${{ github.repository }} \
            --pattern "node-v${NODE_VERSION}-linux-armv7l.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/node-v${NODE_VERSION}-linux-armv7l.tar.gz" -C /tmp/

          echo "=== bin contents and symlinks ==="
          ls -la "/tmp/v${NODE_VERSION}/bin/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tttapa ARMv7 toolchain sysroot for QEMU
        run: |
          # We need ARM libc for QEMU to run the binary.
          # Since we built with -static-libstdc++ -static-libgcc only libc
          # needs to be present at runtime. We get it from the tttapa sysroot
          # which is already downloaded — no multiarch apt needed.
          # (dpkg --add-architecture armhf fails on Noble GitHub runners because
          # ports.ubuntu.com armhf packages are not available via security.ubuntu.com)
          wget -q https://github.com/tttapa/toolchains/releases/download/1.3.1/x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz
          mkdir -p /opt/tttapa-toolchains
          tar -xf x-tools-armv7-neon-linux-gnueabihf-gcc13.tar.xz             --strip-components=1             -C /opt/tttapa-toolchains             x-tools/armv7-neon-linux-gnueabihf

          # The sysroot contains ARM libc — point QEMU at it
          SYSROOT=/opt/tttapa-toolchains/armv7-neon-linux-gnueabihf/armv7-neon-linux-gnueabihf/sysroot
          echo "=== Sysroot lib contents ==="
          ls "$SYSROOT/lib/" | head -20
          echo "QEMU_LD_PREFIX=$SYSROOT" >> $GITHUB_ENV

      - name: Smoke test - basic functionality
        run: |
          NODE="$NODE_BIN"
          echo "=== Node version ==="
          qemu-arm-static $NODE --version

          echo "=== Basic JS execution ==="
          qemu-arm-static $NODE -e "console.log('hello from armv7')"

          echo "=== Math ==="
          qemu-arm-static $NODE -e "console.log(2 ** 32)"

          echo "=== Buffer ==="
          qemu-arm-static $NODE -e "console.log(Buffer.from('hello').toString('hex'))"

          echo "=== async/await ==="
          qemu-arm-static $NODE -e "
            (async () => {
              const result = await Promise.resolve(42);
              console.log('async result:', result);
            })();
          "

          echo "=== require ==="
          qemu-arm-static $NODE -e "
            const os = require('os');
            console.log('arch:', os.arch());
            console.log('platform:', os.platform());
          "

      - name: Test npm
        run: |
          NODE="$NODE_BIN"
          NPM="$NPM_BIN"

          echo "=== npm version ==="
          qemu-arm-static $NODE $NPM --version

          echo "=== npm install test ==="
          mkdir -p /tmp/npm-test
          cd /tmp/npm-test
          qemu-arm-static $NODE $NPM init -y
          qemu-arm-static $NODE $NPM install lodash --prefer-offline 2>&1 | tail -5
          # Verify installed module works
          qemu-arm-static $NODE -e "
            const _ = require('/tmp/npm-test/node_modules/lodash');
            console.log('lodash chunk:', _.chunk([1,2,3,4], 2));
          "

      - name: Run official Node test suite (parallel subset)
        run: |
          NODE="$NODE_BIN"
          cd node

          # Run a subset of the parallel tests - avoid ones that need
          # network, native addons, or are timing-sensitive under QEMU.
          # QEMU is ~5-10x slower than native so timeouts need adjusting.
          qemu-arm-static $NODE tools/test.py \
            --mode=release \
            --timeout=120 \
            --skip-tests=test/parallel/test-child-process* \
            --skip-tests=test/parallel/test-cluster* \
            --skip-tests=test/parallel/test-net-* \
            --skip-tests=test/parallel/test-http* \
            --skip-tests=test/parallel/test-https* \
            --skip-tests=test/parallel/test-tls-* \
            --skip-tests=test/parallel/test-crypto-* \
            parallel \
            2>&1 | tail -50 || true

          echo "=== Test run complete ==="

      - name: Run Node's own test runner (lighter subset)
        run: |
          NODE="$NODE_BIN"
          cd node

          # Alternatively, run individual known-good tests directly
          # These cover core JS engine correctness
          TESTS=(
            "test/parallel/test-assert.js"
            "test/parallel/test-buffer-alloc.js"
            "test/parallel/test-buffer-from.js"
            "test/parallel/test-es6-arrow-functions.js"
            "test/parallel/test-es6-destructuring.js"
            "test/parallel/test-es6-generators.js"
            "test/parallel/test-es6-map.js"
            "test/parallel/test-es6-promise.js"
            "test/parallel/test-es6-set.js"
            "test/parallel/test-es6-template-strings.js"
            "test/parallel/test-stream2-basic.js"
            "test/parallel/test-timers-immediate.js"
            "test/parallel/test-util-format.js"
            "test/parallel/test-v8-coverage.js"
          )

          PASS=0
          FAIL=0
          for t in "${TESTS[@]}"; do
            if [ -f "$t" ]; then
              if qemu-arm-static $NODE "$t" > /dev/null 2>&1; then
                echo "PASS: $t"
                PASS=$((PASS+1))
              else
                echo "FAIL: $t"
                FAIL=$((FAIL+1))
              fi
            fi
          done

          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          [ $FAIL -eq 0 ] || exit 1
